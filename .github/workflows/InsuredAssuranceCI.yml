name: InsuredAssurance CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Maven Action
      run: mvn -version

    - name: Test with Maven
      run: mvn clean test

    - name: Connect to Lab and Trigger Jenkins Job
      run: |
        curl -v -X POST "https://grating-dispersed-glider.ngrok-free.dev/job/InsuredAssurance/build?token=50115ca3611ea2099c45983de1cf1abf"
