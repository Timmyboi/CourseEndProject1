name: InsuredAssurance CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Build and test with Maven
        run: mvn clean test

      - name: Trigger Jenkins Job
        env:
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            --user "timkem1122:${JENKINS_API_TOKEN}" \
            -X POST \
            "https://grating-dispersed-glider.ngrok-free.dev/job/InsuredAssurance/build"
