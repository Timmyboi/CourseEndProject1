name: InsuredAssurance CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Maven Action
      run: mvn -version

    - name: Test with Maven
      run: mvn clean test

    - name: Connect to Lab and Trigger Jenkins Job
      run: |
        curl -X POST "https://grating-dispersed-glider.ngrok-free.dev/job/InsuredAssurance/build" \ --user "timkem1122:REMOVED_JENKINS_CREDENTIAL"
